name: Composer images

on:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - .dockerignore
      - versions.json
      - versions.lock.json
      - scripts/**
      - tests/**
      - .github/workflows/**
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - versions.json
      - versions.lock.json
      - scripts/**
      - .github/workflows/**
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Resolve latest upstream digests before building
        type: boolean
        default: true
      publish:
        description: Publish to Docker Hub (default branch only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: composer-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      publish: ${{ steps.matrix.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test version tooling and committed lock
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/versions.py validate
          bash -n tests/smoke.sh
      - name: Fetch upstream PHP and Composer updates
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python3 scripts/versions.py refresh
      - name: Generate image matrix
        id: matrix
        env:
          SHOULD_PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        run: |
          python3 scripts/versions.py validate
          printf 'matrix=%s\n' "$(python3 scripts/versions.py matrix)" >> "$GITHUB_OUTPUT"
          printf 'publish=%s\n' "$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Retain resolved versions for reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: resolved-versions
          path: versions.lock.json
          if-no-files-found: error
          retention-days: 30

  images:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: PHP ${{ matrix.php }} / Composer ${{ matrix.composer }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build AMD64 test image
        if: contains(matrix.platforms, 'linux/amd64')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.local_tag }}
          build-args: |
            PHP_IMAGE=${{ matrix.php_image }}
            COMPOSER_IMAGE=${{ matrix.composer_image }}
          cache-from: type=gha,scope=php${{ matrix.php }}-composer${{ matrix.composer }}-amd64
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}-composer${{ matrix.composer }}-amd64
      - name: Smoke-test AMD64 image
        if: contains(matrix.platforms, 'linux/amd64')
        env:
          IMAGE: ${{ matrix.local_tag }}
          PHP_VERSION: ${{ matrix.php }}
          COMPOSER_VERSION: ${{ matrix.composer }}
        run: bash tests/smoke.sh "$IMAGE" "$PHP_VERSION" "$COMPOSER_VERSION" linux/amd64
      - name: Build ARM64 test image
        if: contains(matrix.platforms, 'linux/arm64')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ matrix.local_tag }}
          build-args: |
            PHP_IMAGE=${{ matrix.php_image }}
            COMPOSER_IMAGE=${{ matrix.composer_image }}
          cache-from: type=gha,scope=php${{ matrix.php }}-composer${{ matrix.composer }}-arm64
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}-composer${{ matrix.composer }}-arm64
      - name: Smoke-test ARM64 image
        if: contains(matrix.platforms, 'linux/arm64')
        env:
          IMAGE: ${{ matrix.local_tag }}
          PHP_VERSION: ${{ matrix.php }}
          COMPOSER_VERSION: ${{ matrix.composer }}
        run: bash tests/smoke.sh "$IMAGE" "$PHP_VERSION" "$COMPOSER_VERSION" linux/arm64
      - name: Publish tested multi-platform image
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ matrix.tags }}
          build-args: |
            PHP_IMAGE=${{ matrix.php_image }}
            COMPOSER_IMAGE=${{ matrix.composer_image }}
          cache-from: |
            type=gha,scope=php${{ matrix.php }}-composer${{ matrix.composer }}-amd64
            type=gha,scope=php${{ matrix.php }}-composer${{ matrix.composer }}-arm64